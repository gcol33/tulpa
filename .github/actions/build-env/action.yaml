name: build-env
description: >
  R, the compile cache, and the arithmetic baseline the engine is built under.
  Every job here goes through this, so the platforms compile the same source
  the same way and a difference between them is the platform -- except for the
  one input a job is allowed to vary, `fp-contract`, which is what decides
  whether the job checks a pinned comparison or the arithmetic the package
  actually ships.

inputs:
  r-version:
    description: R version handed to r-lib/actions/setup-r.
    required: false
    default: release
  dependencies:
    description: Dependency classes to resolve.
    required: false
    default: '"all"'
  extra-packages:
    description: Packages to install beyond the resolved dependencies.
    required: false
    default: ''
  cache-key:
    description: Suffix separating one job's compile cache from another's.
    required: false
    default: default
  fp-contract:
    description: >
      `off` pins the arithmetic with -ffp-contract=off so a C++ result and the
      same expression in R round identically; `default` leaves the compiler
      alone, which is what CRAN and r-universe build. See the step below.
    required: false
    default: 'off'

outputs:
  ccache-key:
    description: The key the compile cache is saved under.
    value: ${{ steps.ccache-restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - uses: gcol33/actions/setup-pandoc@v1

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    # A compiler contracts a multiply and an add into a single FMA wherever the
    # target has the instruction, and the fused result carries one rounding
    # where the separate operations carry two. Every equivalence assertion that
    # compares a C++ result against the same arithmetic in R then reads the
    # runner's instruction set rather than the algorithm. -ffp-contract=off
    # holds both sides to the same rounding.
    #
    # It is an input rather than a constant because the two readings it
    # separates are both wanted, and setting it everywhere gave neither
    # (gcol33/tulpa#611): with the flag on every job, nothing in CI compiled
    # the arithmetic the package ships, on any platform. 0.2.0 was green on all
    # four and then failed `checking tests` on every aarch64 r-universe build,
    # which compiles without it -- and macOS arm64 is a CRAN check flavour, so
    # that was a submission rejection the matrix was there to prevent.
    #
    #   off      the algorithm, with rounding held to R's. A failure here is a
    #            difference in what the code computes.
    #   default  what CRAN and r-universe build. A failure here that the pinned
    #            job does not reproduce is the contraction, not the algorithm.
    #
    # Whether either binds depends on the target: FMA is baseline on aarch64
    # and is not in the generic x86-64 the runners compile for, which is why
    # the divergence appeared on arm64 alone. So the pair is worth running
    # where it separates something, and the matrix pairs them on macOS.
    #
    # -march is deliberately NOT set. Both Linux runners already target the
    # x86-64 baseline a CRAN binary is built for, so naming it changes no code
    # and only raises "checking compilation flags used ... NOTE: non-portable
    # flag(s) -march=x86-64" -- which would then mask the same note arriving
    # from the package's own Makevars.
    #
    # R_MAKEVARS_USER rather than ~/.R/Makevars: on Windows R expands ~ to the
    # Documents folder while the shell expands it to the profile root, so the
    # file lands where R does not look for it. An explicit path is read the
    # same way everywhere. Set before dependency resolution so the dependency
    # compiles take the same flags and the same cache.
    - name: Arithmetic baseline
      shell: bash
      env:
        FP_CONTRACT: ${{ inputs.fp-contract }}
      run: |
        case "$FP_CONTRACT" in
          off|default) ;;
          *) echo "fp-contract must be 'off' or 'default', got '$FP_CONTRACT'" >&2
             exit 1 ;;
        esac
        mk="$RUNNER_TEMP/tulpa-makevars"
        : > "$mk"
        if [ "$FP_CONTRACT" = "off" ]; then
          for v in CFLAGS CXXFLAGS CXX11FLAGS CXX14FLAGS CXX17FLAGS CXX20FLAGS; do
            echo "$v += -ffp-contract=off" >> "$mk"
          done
        fi
        if command -v cygpath >/dev/null 2>&1; then
          mk_r=$(cygpath -m "$mk")
        else
          mk_r="$mk"
        fi
        echo "R_MAKEVARS_USER=$mk_r" >> "$GITHUB_ENV"
        echo "fp-contract: $FP_CONTRACT"
        cat "$mk"

    # A cold build of the engine is most of a job. On Linux and macOS ccache is
    # reached through PATH rather than by overriding CXX, which would drop the
    # -std flag R pairs with its own compiler entry. On Windows R puts the
    # Rtools compilers at the front of PATH itself, so the user Makevars
    # prefixes R's own compiler definitions instead (`CXX17 := ccache
    # $(CXX17)`), which keeps every flag R set. R CMD build and R CMD check each
    # compile the sources under their own random temporary directory, so the
    # working directory is kept out of the hash (NOHASHDIR) and absolute paths
    # are rewritten relative to it (BASEDIR); otherwise no compile can hit an
    # entry another one wrote. On Windows BASEDIR is the checkout's drive, and
    # TMPDIR moves R's temporary directory onto it.
    - name: Compile cache
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update -qq
            sudo apt-get install -y ccache
            echo /usr/lib/ccache >> "$GITHUB_PATH"
            cache_dir="$HOME/.ccache"; base_dir=/ ;;
          macOS)
            brew install ccache
            echo "$(brew --prefix)/opt/ccache/libexec" >> "$GITHUB_PATH"
            cache_dir="$HOME/.ccache"; base_dir=/ ;;
          Windows)
            choco install ccache -y --no-progress
            mk="$RUNNER_TEMP/tulpa-makevars"
            for v in CC CXX CXX11 CXX14 CXX17 CXX20; do
              echo "$v := ccache \$($v)" >> "$mk"
            done
            cat "$mk"
            cache_dir=$(cygpath -m "$HOME/.ccache")
            tmp=$(cygpath -m "$RUNNER_TEMP/rtmp"); mkdir -p "$RUNNER_TEMP/rtmp"
            base_dir="${tmp%%:*}:/"
            echo "TMPDIR=$tmp" >> "$GITHUB_ENV" ;;
        esac
        {
          echo "CCACHE_DIR=$cache_dir"
          echo "CCACHE_MAXSIZE=2G"
          echo "CCACHE_COMPRESS=1"
          echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros"
          echo "CCACHE_NOHASHDIR=1"
          echo "CCACHE_BASEDIR=$base_dir"
        } >> "$GITHUB_ENV"

    # Restore only: actions/cache saves in its post step when the job
    # succeeds, so a red job never stored what it compiled and the next run
    # started cold. The calling workflow saves with `if: always()` through the
    # save-ccache action.
    - name: Restore compile cache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ inputs.r-version }}-${{ inputs.cache-key }}-fp${{ inputs.fp-contract }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.r-version }}-${{ inputs.cache-key }}-fp${{ inputs.fp-contract }}-
          ccache-${{ runner.os }}-${{ inputs.r-version }}-${{ inputs.cache-key }}-
          ccache-${{ runner.os }}-${{ inputs.r-version }}-

    # A templated inference kernel is a large translation unit, and the macOS
    # runner carries less memory per core than the others.
    - name: Parallel build width
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          echo "MAKEFLAGS=-j2" >> "$GITHUB_ENV"
        else
          echo "MAKEFLAGS=-j3" >> "$GITHUB_ENV"
        fi

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: ${{ inputs.dependencies }}
        extra-packages: ${{ inputs.extra-packages }}
