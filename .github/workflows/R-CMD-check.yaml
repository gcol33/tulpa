name: R-CMD-check

# Checks a BUILT TARBALL on every platform at the tier CRAN runs, so a
# failure that only a non-Windows toolchain can produce -- an optimizer status
# code that differs by platform, a graphics device that cannot start on a
# headless machine, a fused multiply-add changing the last bit of a comparison
# -- surfaces here rather than at submission.
#
# The FMA case is what `fp` in the matrix is for. FMA is baseline on aarch64
# and absent from the generic x86-64 the other runners compile for, so macOS is
# the only platform here where contraction is reachable at all, and it runs
# twice: pinned with -ffp-contract=off, and once as CRAN and r-universe build
# it. A failure the unpinned job alone shows is the contraction; one both show
# is the algorithm. With the flag on every job neither reading was available,
# which is how 0.2.0 went out green and failed on every aarch64 r-universe
# build (gcol33/tulpa#611).
#
# One job additionally builds the reference manual. The Rd LaTeX pass is the
# only thing that reads typographic Unicode in the roxygen sources, and the
# local check runs with --no-manual.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A later push supersedes an in-flight run: the engine takes most of a job to
# compile, and a queue of superseded runs delays the one being waited on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The platform list both jobs below run on, and the tier-1 shards. One list,
  # so the check and the tier it no longer runs whole cannot drift apart.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - id: platforms
        shell: bash
        run: |
          echo 'platforms=[
            {"os":"ubuntu-latest","r":"release","manual":"1","fp":"off"},
            {"os":"ubuntu-latest","r":"devel","manual":"0","fp":"off"},
            {"os":"macos-latest","r":"release","manual":"0","fp":"off"},
            {"os":"macos-latest","r":"release","manual":"0","fp":"default"},
            {"os":"windows-latest","r":"release","manual":"0","fp":"off"},
            {"os":"windows-latest","r":"devel","manual":"0","fp":"off"}
          ]' | tr -d ' \n' >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - id: shards
        run: |
          source(".github/scripts/tier-files.R")
          write_shard_plan("tier1")
        shell: Rscript {0}

  check:
    needs: plan
    name: ${{ matrix.os }} (${{ matrix.r }}, fp-contract ${{ matrix.fp }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TULPA_CHECK_MANUAL: ${{ matrix.manual }}

    steps:
      - uses: actions/checkout@v4

      - id: build-env
        uses: ./.github/actions/build-env
        with:
          r-version: ${{ matrix.r }}
          cache-key: check
          fp-contract: ${{ matrix.fp }}
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.manual == '1' && 'any::V8' || '' }}

      - name: TinyTeX
        if: matrix.manual == '1'
        uses: r-lib/actions/setup-tinytex@v2

      # "checking HTML version of manual" validates the rendered help pages
      # with HTML Tidy and the KaTeX math with V8; without either it skips both
      # and reports the skip as a NOTE.
      - name: HTML Tidy
        if: matrix.manual == '1'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y tidy

      # The DESCRIPTION spell check inside the incoming-feasibility check runs
      # only where aspell finds a program to call; with none installed it is
      # skipped and the check reports no misspelled words either way.
      - name: Spell-checker
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y aspell aspell-en

      - name: Check
        run: Rscript .github/scripts/check.R

      - name: Save compile cache
        if: always()
        uses: ./.github/actions/save-ccache
        with:
          key: ${{ steps.build-env.outputs.ccache-key }}

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}-fp-${{ matrix.fp }}
          path: check
          if-no-files-found: warn
          retention-days: 30

  # Tier 1 whole -- every test file under the CRAN profile with the CRAN budget
  # open -- on every platform the check runs on, in shards against the
  # installed package. The check itself runs only what CRAN runs.
  tier1:
    needs: plan
    name: tier 1 ${{ matrix.platform.os }} (${{ matrix.platform.r }}, fp-contract ${{ matrix.platform.fp }}) shard ${{ matrix.shard.shard }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'false'
      TULPA_CRAN_BUDGET: 'off'
      TULPA_TIER: '1'
      TULPA_TEST_FILES: ${{ matrix.shard.files }}
      TULPA_TEST_OUT: tier1-out
    steps:
      - uses: actions/checkout@v4

      - id: build-env
        uses: ./.github/actions/build-env
        with:
          r-version: ${{ matrix.platform.r }}
          cache-key: check
          fp-contract: ${{ matrix.platform.fp }}

      # bash on every runner: on Windows the default shell is pwsh, where `R`
      # is the Invoke-History alias.
      - name: Install package
        shell: bash
        run: R CMD INSTALL --no-multiarch .

      - name: Tier 1
        shell: bash
        run: Rscript .github/scripts/run-tests.R

      - name: Save compile cache
        if: always()
        uses: ./.github/actions/save-ccache
        with:
          key: ${{ steps.build-env.outputs.ccache-key }}

      - name: Upload tier timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-${{ matrix.platform.os }}-${{ matrix.platform.r }}-fp-${{ matrix.platform.fp }}-${{ matrix.shard.shard }}
          path: tier1-out
          if-no-files-found: warn
          retention-days: 30
